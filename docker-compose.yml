services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: minebet
      POSTGRES_PASSWORD: minebet
      POSTGRES_DB: minebet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minebet"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
